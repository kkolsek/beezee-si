---
# cPanel Git Version Control: razporeditev ob "Deploy HEAD Commit"
# Zdaj: test.beezee.si (+ noindex). Ob objavi v zivo: DEPLOYPATH = /home/beezeesi/public_html/ in odstrani zadnjo vrstico (noindex).
deployment:
  tasks:
    - export DEPLOYPATH=/home/beezeesi/test.beezee.si/
    - /bin/cp -R dist/. $DEPLOYPATH
    - /bin/cat deploy/test-noindex.conf >> $DEPLOYPATH.htaccess
