---
# cPanel Git Version Control: razporeditev ob "Deploy HEAD Commit" na beezee.si (public_html).
# 1) prekopira dist/ (slike, pisave, PDF, zadnja zgrajena stran)
# 2) na strezniku zgradi strani iz src/ neposredno v public_html (BEEZEE_DIST)
# .htaccess s preusmeritvami pausie/lonc je v src/.htaccess in dist/.htaccess
deployment:
  tasks:
    - export DEPLOYPATH=/home/beezeesi/public_html/
    - /bin/cp -R dist/. $DEPLOYPATH
    - export BEEZEE_DIST=$DEPLOYPATH
    - python3 -B src/build.py
